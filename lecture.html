<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07041a">
<title>Lecture de notes</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Music&display=swap">
<!-- 2026-11-24 : l'exercice « Lecture de notes » (une note à la fois + lecture en avance) pour le téléphone.
     Page autonome : aucune bibliothèque. Le micro du téléphone écoute le piano (le son ne quitte jamais le téléphone) :
     la hauteur est trouvée ici même (autocorrélation normalisée), seul le nom de la note compte (pas l'octave).
     Records et réglages gardés dans ce navigateur ; 2026-11-24 synchro : records, essais et niveau sont aussi
     envoyés au PC (serveur de Nova, /api/montrer/lecture, avec la clé de l'appareil déjà relié, jamais à GitHub)
     et fusionnés avec ceux de l'appli du PC : meilleur record gardé, essais cumulés sans doublon. PC injoignable :
     tout reste ici et part au retour. -->
<style>
:root{
  --fond:#07041a; --fond2:#120b2e; --texte:#f4efff; --doux:#b9b0d6; --ligne:#2b2156;
  --papier:#f7f2e6; --encre:#1d1b17; --juste:#1f9d55; --faux:#d23b3b; --saute:#d98a1c; --encours:#1c6fd6;
  --accent:#8f7bff; --touche:#fbfaf7; --touche-bord:#cfc8b8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fond);color:var(--texte)}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  padding:max(10px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:10px;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:15px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin:0;color:var(--doux)}
#micro{display:flex;align-items:center;gap:8px;background:var(--fond2);border:1px solid var(--ligne);padding:8px 14px;border-radius:999px;font-size:15px}
#micro i{width:10px;height:10px;border-radius:50%;background:#6b628c;flex:none}
#micro.on i{background:#3ee07f;box-shadow:0 0 10px #3ee07f}
#micro.ko i{background:var(--faux)}
.groupe{display:flex;background:var(--fond2);border:1px solid var(--ligne);border-radius:14px;padding:3px}
.groupe button{flex:1;padding:10px 6px;border-radius:11px;background:none;color:var(--doux);font-size:15px}
.groupe button.on{background:var(--accent);color:#fff;font-weight:600}
select{width:100%;font:inherit;font-size:15px;color:var(--texte);background:var(--fond2);border:1px solid var(--ligne);border-radius:12px;padding:10px 12px}
#reglages{display:flex;gap:8px}
#reglages[hidden]{display:none}
.regle{flex:1;display:flex;align-items:center;justify-content:space-between;background:var(--fond2);border:1px solid var(--ligne);border-radius:12px;padding:4px}
.regle span{font-size:13px;color:var(--doux);padding-left:8px}
.regle b{min-width:2.4em;text-align:center;font-size:15px}
.regle button{width:38px;height:38px;border-radius:10px;background:#231a4d;font-size:20px}
#papier{background:var(--papier);color:var(--encre);border-radius:16px;padding:10px 8px 6px;min-height:160px;display:flex;flex-direction:column;justify-content:center;gap:2px}
#papier svg{width:100%;height:auto;display:block}
#infos{display:flex;justify-content:space-between;align-items:baseline;color:#5d574b;font-size:14px;padding:2px 6px 0}
#chrono{font-variant-numeric:tabular-nums;font-weight:600;color:var(--encre);font-size:17px}
#retour{min-height:24px;text-align:center;font-size:17px;font-weight:600}
#retour.juste{color:#5fe39a}#retour.faux{color:#ff7d7d}
#entends{display:flex;align-items:center;gap:10px;color:var(--doux);font-size:14px}
#entends b{color:var(--texte);font-size:16px;min-width:2.6em}
#niveau-son{flex:1;height:6px;background:var(--fond2);border-radius:3px;overflow:hidden}
#niveau-son i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4c7dff,#3ee07f)}
#touches{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:auto}
#touches button{height:88px;background:var(--touche);color:#2a2620;border-radius:0 0 10px 10px;border:1px solid var(--touche-bord);
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;font-size:16px;font-weight:600;transition:background .12s}
#touches button:active{background:#e6e0d2}
#touches button.juste{background:#bfeccf}#touches button.faux{background:#f6c0c0}#touches button.ecoute{box-shadow:inset 0 -5px 0 var(--encours)}
#actions{display:flex;gap:8px}
#actions button{flex:1;padding:14px;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:600}
#bilan{background:var(--papier);color:var(--encre);border-radius:16px;padding:14px 12px}
#bilan[hidden],#papier[hidden]{display:none}
#bilan h2{margin:0;font-size:34px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
#bilan p{margin:8px 0;font-size:15px}
#bilan .gros{text-align:center;font-size:16px}
.bien{color:var(--juste);font-weight:600}.mal{color:var(--faux);font-weight:600}
#aide{font-size:13px;color:var(--doux);text-align:center;margin:0}
#test-sortie{display:none}
</style>
</head>
<body>
<header><h1>Lecture de notes</h1><button id="micro" type="button"><i></i><span>Micro</span></button></header>
<div id="modes" class="groupe"><button data-mode="une" type="button">Une note à la fois</button><button data-mode="avance" type="button">Lecture en avance</button></div>
<select id="niveau" aria-label="Niveau"></select>
<div id="reglages" hidden>
  <div class="regle"><span>Cacher</span><button data-r="cache-" type="button">−</button><b id="v-cache"></b><button data-r="cache+" type="button">+</button></div>
  <div class="regle"><span>Notes</span><button data-r="n-" type="button">−</button><b id="v-n"></b><button data-r="n+" type="button">+</button></div>
</div>
<div id="papier"><div id="portee"></div><div id="infos"><span id="ou"></span><span id="chrono"></span></div></div>
<div id="bilan" hidden></div>
<div id="retour"></div>
<div id="entends"><span>J'entends</span><b id="entendu">–</b><div id="niveau-son"><i></i></div></div>
<div id="touches"></div>
<div id="actions"><button id="go" type="button">Commencer</button></div>
<p id="aide">Joue la note au piano, ou touche son nom.</p>
<pre id="test-sortie"></pre>
<script>
"use strict";
(() => {
  const $ = (s) => document.querySelector(s);
  const NOMS = ["do", "ré", "mi", "fa", "sol", "la", "si"];
  const LETTRES = "CDEFGAB";
  const DEMI = [0, 2, 4, 5, 7, 9, 11];
  const BAS = { fa: 18, sol: 30 };
  const GLYPHE = { fa: "\u{1D122}", sol: "\u{1D11E}" };
  const POLICE = '"Noto Music", "Segoe UI Symbol", "Noto Sans Symbols 2", "Apple Symbols", "Cambria Math", serif';
  const borne = (v, a, b) => Math.max(a, Math.min(b, v));
  const N = (cle, nom, notes) => ({ cle, nom, notes: notes ? notes.split(" ") : [] });
  // les mêmes niveaux que l'appli du PC (interface\apprentissage\lecture.js)
  const NIVEAUX = [
    N("fa", "Clé de fa : mi, fa, sol", "E3 F3 G3"),
    N("fa", "Clé de fa : + do, ré", "C3 D3"),
    N("fa", "Clé de fa : + la, si, do", "A3 B3 C4"),
    N("fa", "Clé de fa : + les graves", "G2 A2 B2"),
    N("fa", "Clé de fa : hors de la portée", "E2 F2 D4 E4"),
    N("sol", "Clé de sol : fa, sol, la", "F4 G4 A4"),
    N("sol", "Clé de sol : + do, ré, mi", "C4 D4 E4"),
    N("sol", "Clé de sol : + si, do, ré", "B4 C5 D5"),
    N("sol", "Clé de sol : + mi, fa, sol", "E5 F5 G5"),
    N("sol", "Clé de sol : hors de la portée", "A3 B3 A5 B5"),
    N("deux", "Les deux clés mélangées", ""),
  ];
  const note = (n) => { const i = LETTRES.indexOf(n[0]), o = parseInt(n.slice(1), 10); return { degre: o * 7 + i, nom: NOMS[i], midi: 12 * (o + 1) + DEMI[i] }; };
  const cartesDe = (i) => {
    const v = NIVEAUX[i], t = [];
    NIVEAUX.forEach((n, j) => { if (n.cle !== "deux" && (v.cle === "deux" || (n.cle === v.cle && j <= i))) for (const x of n.notes) t.push(n.cle + ":" + x); });
    return t;
  };
  const jour = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const secondes = (ms) => (Math.round(ms / 100) / 10).toFixed(1).replace(".", ",") + " s";
  const params = new URLSearchParams(location.search);
  const TEST = params.has("test");

  // ---------- ce qui est gardé (dans ce navigateur seulement) ----------
  const CLE_STOCK = "nova-lecture-tel-1";
  function charger() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(CLE_STOCK) || "null"); } catch (e) { d = null; }
    d = d && typeof d === "object" ? d : {};
    return { niveau: borne(+d.niveau || 0, 0, NIVEAUX.length - 1), mode: d.mode === "une" ? "une" : "avance",
      cache: borne(+d.cache || 0, 0, 5), n: borne(+d.n || 10, 3, 30),
      records: d.records && typeof d.records === "object" ? d.records : {}, essais: Array.isArray(d.essais) ? d.essais.slice(-MAX_ESSAIS) : [],
      niveau_t: +d.niveau_t || 0 };
  }
  const MAX_ESSAIS = 300;
  const D = charger();
  function sauver() { try { localStorage.setItem(CLE_STOCK, JSON.stringify(D)); } catch (e) { /* navigation privée : tant pis */ } }
  const nouvelId = () => {
    try { const b = new Uint8Array(9); crypto.getRandomValues(b); return "t" + Array.from(b, (x) => x.toString(16).padStart(2, "0")).join(""); }
    catch (e) { return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  };
  // les anciens essais (sans id) en reçoivent un, une fois pour toutes : le PC ne les comptera qu'une fois
  D.essais.forEach((x) => { if (x && typeof x === "object" && !x.id) x.id = nouvelId(); });

  // ---------- 2026-11-24 synchro avec le PC (serveur de Nova, clé de l'appareil déjà relié) ----------
  // Rien ne part vers GitHub : seulement vers le tunnel ou l'adresse Wi-Fi que l'appli Nova a enregistrés dans ce
  // téléphone (nova-conf-v1). Sans clé ou sans réseau : on garde tout ici et on réessaie plus tard.
  const TUNNEL_OK = /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/;
  const WIFI_OK = /^https:\/\/(10|192\.168|172\.(1[6-9]|2\d|3[01]))(\.\d{1,3}){2,3}(:\d+)?$/;
  const SY = { etat: "jamais", dernier: 0, envoyes: 0, recus: 0, erreur: "" };
  let enCours = null;
  function confNova() {
    try { const c = JSON.parse(localStorage.getItem("nova-conf-v1") || "null"); return c && typeof c === "object" ? c : null; } catch (e) { return null; }
  }
  const meilleur = (a, b) => (!a || (b && +b.ms > 0 && +b.ms < +a.ms) ? b : a);
  function fusionRecue(r) {
    if (!r || typeof r !== "object") return false;
    let change = false;
    const rec = r.records && typeof r.records === "object" ? r.records : {};
    for (const k of Object.keys(rec)) {
      const v = rec[k];
      if (!v || !(+v.ms > 0)) continue;
      const m = meilleur(D.records[k], v);
      if (m !== D.records[k]) { D.records[k] = { ms: +v.ms, moyenne: +v.moyenne || undefined, date: v.date }; change = true; }
    }
    const vus = new Set(D.essais.map((x) => x && x.id));
    for (const x of Array.isArray(r.essais) ? r.essais : []) {
      if (!x || typeof x !== "object" || !x.id || vus.has(x.id)) continue;
      vus.add(x.id); D.essais.push(x); change = true;
    }
    if (change) {
      D.essais.sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")) || (+a.t || 0) - (+b.t || 0));
      D.essais = D.essais.slice(-MAX_ESSAIS);
    }
    const n = parseInt(r.niveau, 10), t = +r.niveau_t || 0;
    if (n >= 0 && n < NIVEAUX.length && t > (D.niveau_t || 0) && n !== D.niveau && S.phase !== "jeu") { D.niveau = n; D.niveau_t = t; change = true; }
    else if (t > (D.niveau_t || 0) && n === D.niveau) D.niveau_t = t;
    if (change) { sauver(); if (S.phase === "accueil") peindre(); }
    return change;
  }
  async function envoyerA(base, appareil) {
    const corps = { records: D.records, essais: D.essais };
    if (D.niveau_t) { corps.niveau = D.niveau; corps.niveau_t = D.niveau_t; }
    const ctl = typeof AbortController === "function" ? new AbortController() : null;
    const minuteur = ctl ? setTimeout(() => ctl.abort(), 8000) : 0;
    try {
      const meme = !base;
      const r = await fetch((base || "") + "/api/montrer/lecture", { method: "POST", cache: "no-store",
        mode: meme ? "same-origin" : "cors", credentials: meme ? "same-origin" : "omit",
        headers: Object.assign({ "Content-Type": "application/json" }, appareil ? { "X-Nova-Appareil": appareil } : {}),
        body: JSON.stringify(corps), signal: ctl ? ctl.signal : undefined });
      if (!r.ok) return { ok: false, statut: r.status };
      return { ok: true, d: await r.json() };
    } finally { clearTimeout(minuteur); }
  }
  function synchro() {
    if (enCours) return enCours;
    enCours = (async () => {
      const c = confNova(), appareil = c && typeof c.appareil === "string" ? c.appareil : "";
      const surGitHub = /\.github\.io$/.test(location.hostname);
      const bases = [];
      if (!surGitHub && location.protocol === "https:") bases.push("");   // page servie par Nova elle-même
      if (c && WIFI_OK.test(c.local || "")) bases.push(c.local);
      if (c && TUNNEL_OK.test(c.base || "")) bases.push(c.base);
      if (!appareil && surGitHub) { SY.etat = "pas relié"; return false; }
      if (!bases.length || (typeof navigator.onLine === "boolean" && !navigator.onLine)) { SY.etat = "hors ligne"; return false; }
      for (const b of bases) {
        try {
          const r = await envoyerA(b, appareil);
          if (r.ok) {
            SY.etat = "ok"; SY.dernier = Date.now(); SY.envoyes++; SY.erreur = "";
            if (fusionRecue(r.d)) SY.recus++;
            return true;
          }
          SY.erreur = "statut " + r.statut;
          if (r.statut === 401 || r.statut === 403) break;   // clé refusée : inutile d'insister ailleurs
        } catch (e) { SY.erreur = (e && e.name) || "réseau"; }
      }
      SY.etat = "en attente"; return false;
    })().catch(() => false).finally(() => { enCours = null; rapport(); });
    return enCours;
  }
  if (params.get("mode") === "une" || params.get("mode") === "avance") D.mode = params.get("mode");
  if (params.has("niveau")) D.niveau = borne((parseInt(params.get("niveau"), 10) || 1) - 1, 0, NIVEAUX.length - 1);
  if (params.has("cache")) D.cache = borne(parseInt(params.get("cache"), 10) || 0, 0, 5);
  if (params.has("notes")) D.n = borne(parseInt(params.get("notes"), 10) || 10, 3, 30);

  // ---------- la portée (même dessin que l'appli du PC), en lignes de 5 notes pour l'écran en hauteur ----------
  let mesures = {};
  function encre(cle) {
    if (mesures[cle]) return mesures[cle];
    const c = document.createElement("canvas").getContext("2d");
    c.font = "100px " + POLICE;
    const m = c.measureText(GLYPHE[cle]);
    const h = (m.actualBoundingBoxAscent || 70) + (m.actualBoundingBoxDescent || 20);
    return (mesures[cle] = { haut: m.actualBoundingBoxAscent || 70, h: h > 5 ? h : 90, gauche: m.actualBoundingBoxLeft || 0 });
  }
  function portee(cle, notes, o) {
    const s = o.s, pas = o.pas || s * 2.7, x0 = s * 4.6, haut = s * 3.5, yBas = haut + s * 4;
    const noms = o.noms || notes.some((n) => n.nom);
    const W = Math.max(o.large || 0, x0 + pas * Math.max(1, notes.length) + s * 0.3), H = yBas + s * 3.5 + (noms ? s * 1.9 : 0);
    const y = (d) => yBas - (d - BAS[cle]) * s / 2;
    let h = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="portée en clé de ' + cle + '">';
    for (let i = 0; i < 5; i++) h += '<line x1="' + s * 0.4 + '" x2="' + (W - s * 0.4) + '" y1="' + (yBas - i * s) + '" y2="' + (yBas - i * s) + '" stroke="#4a463e" stroke-width="' + Math.max(1, s * 0.07) + '"/>';
    const e = encre(cle);
    const hCle = cle === "fa" ? s * 2.6 : s * 7.1, yHaut = cle === "fa" ? haut - s * 0.08 : haut - s * 1.25;
    const corps = 100 * hCle / e.h;
    h += '<text x="' + (s * 0.75 + e.gauche * corps / 100) + '" y="' + (yHaut + e.haut * corps / 100) + '" font-size="' + corps + '" font-family=\'' + POLICE + '\' fill="#1d1b17">' + GLYPHE[cle] + "</text>";
    if (o.marque >= 0 && o.marque < notes.length) {
      const mx = x0 + pas * (o.marque + 0.5), my = yBas + s * 2.75;
      h += '<path d="M' + mx + " " + my + "l" + (-s * 0.42) + " " + s * 0.62 + "h" + s * 0.84 + 'z" fill="#1c6fd6"/>';
    }
    notes.forEach((n, i) => {
      if (n.cache) return;
      const p = note(n.k.slice(n.k.indexOf(":") + 1)), d = p.degre - BAS[cle], cx = x0 + pas * (i + 0.5), cy = y(p.degre), c = n.couleur || "#1d1b17";
      const traits = [];
      for (let t = -2; t >= d; t -= 2) traits.push(t);
      for (let t = 10; t <= d; t += 2) traits.push(t);
      for (const t of traits) h += '<line x1="' + (cx - s * 1.05) + '" x2="' + (cx + s * 1.05) + '" y1="' + (yBas - t * s / 2) + '" y2="' + (yBas - t * s / 2) + '" stroke="#4a463e" stroke-width="' + Math.max(1, s * 0.07) + '"/>';
      if (n.halo) h += '<circle cx="' + cx + '" cy="' + cy + '" r="' + s * 1.25 + '" fill="none" stroke="' + c + '" stroke-opacity=".35" stroke-width="' + s * 0.16 + '"/>';
      h += '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + s * 0.63 + '" ry="' + s * 0.44 + '" transform="rotate(-22 ' + cx + " " + cy + ')" fill="' + c + '"/>';
      if (o.hampes !== false) {
        const bas = d >= 4, xh = cx + (bas ? -1 : 1) * s * 0.56;
        h += '<line x1="' + xh + '" x2="' + xh + '" y1="' + (cy + (bas ? 1 : -1) * s * 0.12) + '" y2="' + (cy + (bas ? 1 : -1) * s * 3.2) + '" stroke="' + c + '" stroke-width="' + Math.max(1.2, s * 0.11) + '"/>';
      }
      if (n.nom) h += '<text x="' + cx + '" y="' + (H - s * 0.45) + '" text-anchor="middle" font-size="' + s * 1.15 + '" font-weight="600" fill="' + c + '">' + n.nom + "</text>";
    });
    return h + "</svg>";
  }
  const PAR_LIGNE = 5;
  function lignes(cle, liste, o) {      // la ligne coupée en morceaux de 5 notes, tous de la même largeur
    const s = o.s, pas = o.pas, large = s * 4.6 + pas * PAR_LIGNE + s * 0.3;
    let h = "";
    for (let a = 0; a < liste.length; a += PAR_LIGNE) {
      const m = o.marque >= a && o.marque < a + PAR_LIGNE ? o.marque - a : -1;
      h += portee(cle, liste.slice(a, a + PAR_LIGNE), Object.assign({}, o, { large, marque: m }));
    }
    return h;
  }

  // ---------- l'exercice ----------
  const S = { phase: "accueil", A: null, Q: null, bloque: 0, chrono: 0 };

  function tirer(n, premiere) {        // n notes au hasard, jamais deux fois la même de suite (comme sur le PC)
    const pool = cartesDe(D.niveau);
    let cle = NIVEAUX[D.niveau].cle, p = pool;
    if (cle === "deux") { cle = Math.random() < 0.5 ? "fa" : "sol"; p = pool.filter((k) => k.startsWith(cle + ":")); }
    const t = [];
    for (let i = 0; i < n; i++) {
      const prec = t.length ? t[t.length - 1].k : "";
      let choix = p.length > 1 ? p.filter((k) => k !== prec) : p;
      if (i === 0 && premiere) { const f = choix.filter((k) => note(k.slice(k.indexOf(":") + 1)).nom === premiere); if (f.length) choix = f; }
      const k = choix[Math.floor(Math.random() * choix.length)], x = note(k.slice(k.indexOf(":") + 1));
      t.push({ k, nom: x.nom, midi: x.midi, fautes: 0, ms: 0, ok: false });
    }
    return { cle, notes: t };
  }

  function commencer() {
    clearInterval(S.chrono);
    const t = tirer(D.mode === "avance" ? D.n : 20, params.get("premiere")), t0 = performance.now();
    S.A = { mode: D.mode, cache: D.mode === "avance" ? D.cache : 0, n: t.notes.length, cle: t.cle, notes: t.notes, cur: 0, fautes: 0, t0, dernier: t0, flash: -1, resultat: null };
    S.phase = "jeu"; S.bloque = 0;
    retour("", "");
    S.chrono = setInterval(() => { if (S.phase === "jeu" && S.A) $("#chrono").textContent = secondes(performance.now() - S.A.t0); }, 100);
    peindre();
  }

  // une faute : en rouge, comptée, on reste sur la note ; deux fautes sur la même note : son nom s'écrit
  function repondre(nom, source) {
    if (S.phase !== "jeu" || !S.A || !NOMS.includes(nom)) return false;
    const A = S.A, x = A.notes[A.cur], maint = performance.now();
    if (maint < S.bloque) return false;
    touche(nom, nom === x.nom ? "juste" : "faux");
    if (nom !== x.nom) {
      x.fautes++; A.fautes++; A.flash = A.cur;
      retour(nom + " : non", "faux");
      peindre();
      return true;
    }
    x.ms = Math.round(maint - A.dernier); x.ok = true; A.dernier = maint; A.cur++; A.flash = -1;
    retour(A.mode === "une" ? nom + " · " + secondes(x.ms) : "", "juste");
    if (A.cur >= A.n) fin();
    else {
      if (A.mode === "une") S.bloque = maint + 250;
      peindre();
    }
    return true;
  }

  function fin() {
    const A = S.A, total = Math.round(A.dernier - A.t0), moyenne = Math.round(total / A.n);
    clearInterval(S.chrono);
    const cle = (A.mode === "une" ? "une:" + (D.niveau + 1) : (D.niveau + 1) + ":" + A.cache + ":" + A.n), ancien = D.records[cle];
    const mesure = A.mode === "une" ? moyenne : total;
    const record = A.fautes === 0 && (!ancien || mesure < ancien.ms);
    if (record) D.records[cle] = { ms: mesure, moyenne, date: jour() };
    D.essais = D.essais.concat({ id: nouvelId(), t: Date.now(), origine: "tel", date: jour(), mode: A.mode, niveau: D.niveau + 1, cache: A.cache, n: A.n, ms: total, fautes: A.fautes }).slice(-MAX_ESSAIS);
    sauver();
    setTimeout(synchro, 50);   // vers le PC (en silence ; s'il est injoignable, ça repartira plus tard)
    const lente = A.notes.reduce((m, x) => (x.ms > m.ms ? x : m), A.notes[0]);
    const fautives = A.notes.filter((x) => x.fautes).map((x) => x.nom).filter((x, i, t) => t.indexOf(x) === i);
    A.resultat = { ms: total, moyenne_ms: moyenne, fautes: A.fautes, notes: A.n, record, record_ms: D.records[cle] ? D.records[cle].ms : null, fautives };
    S.phase = "bilan";
    let h = "<h2>" + (A.mode === "une" ? secondes(moyenne) + " par note" : secondes(total)) + "</h2>";
    h += '<p class="gros">' + A.n + " notes" + (A.mode === "avance" ? " · " + secondes(moyenne) + " par note" : "") + " · " +
      (A.fautes ? '<span class="mal">' + A.fautes + " faute" + (A.fautes > 1 ? "s" : "") + "</span>" : '<span class="bien">sans faute</span>') + "</p>";
    if (A.mode === "avance") h += lignes(A.cle, A.notes.map((x) => ({ k: x.k, nom: x.nom, couleur: x.fautes ? "#d23b3b" : "#1f9d55" })), { s: 13, pas: 46, noms: true });
    const unite = A.mode === "une" ? " par note" : "";
    if (record) h += '<p class="bien">' + (ancien ? "Nouveau record : " + secondes(ancien.ms) + unite + " battu." : "Premier record pour ces réglages.") + "</p>";
    else if (A.fautes) h += "<p>Le record compte seulement les essais sans faute" + (A.resultat.record_ms ? " (record : " + secondes(A.resultat.record_ms) + unite + ")" : "") + ". Notes ratées : " + fautives.join(", ") + ".</p>";
    else h += "<p>Record à battre : " + secondes(A.resultat.record_ms) + unite + ".</p>";
    h += "<p>La plus longue à trouver : " + lente.nom + " (" + secondes(lente.ms) + ")." +
      (A.mode === "avance" && !A.fautes && A.cache < 5 ? " Sans faute : essaie en cachant une note de plus." : "") + "</p>";
    $("#bilan").innerHTML = h;
    $("#chrono").textContent = secondes(total);
    peindre();
  }

  function peindre() {
    const A = S.A, jeu = S.phase === "jeu" && A;
    document.querySelectorAll("#modes button").forEach((b) => b.classList.toggle("on", b.dataset.mode === D.mode));
    $("#niveau").value = String(D.niveau);
    $("#reglages").hidden = D.mode !== "avance";
    $("#v-cache").textContent = String(D.cache);
    $("#v-n").textContent = String(D.n);
    $("#papier").hidden = S.phase === "bilan";
    $("#bilan").hidden = S.phase !== "bilan";
    $("#go").textContent = S.phase === "accueil" ? "Commencer" : D.mode === "avance" ? "Nouvelle ligne" : "Nouvelle série";
    const P = $("#portee");
    if (jeu && A.mode === "avance") {
      const liste = A.notes.map((x, i) => ({
        k: x.k,
        cache: A.cache > 0 && A.cur > 0 && i < A.cur + A.cache && i !== A.flash,
        couleur: i < A.cur ? "#1f9d55" : i === A.flash ? "#d23b3b" : "#1d1b17",
        halo: i === A.flash,
        nom: i === A.flash && x.fautes >= 2 ? x.nom : "",
      }));
      P.innerHTML = lignes(A.cle, liste, { s: 15, pas: 52, noms: true, marque: A.cur });
      $("#ou").textContent = "clé de " + A.cle + " · " + A.cur + " / " + A.n + (A.fautes ? " · " + A.fautes + " faute" + (A.fautes > 1 ? "s" : "") : "");
    } else if (jeu) {
      const x = A.notes[A.cur], cle = x.k.slice(0, x.k.indexOf(":"));
      P.innerHTML = portee(cle, [{ k: x.k, couleur: A.flash === A.cur ? "#d23b3b" : "#1d1b17", halo: A.flash === A.cur, nom: A.flash === A.cur && x.fautes >= 2 ? x.nom : "" }], { s: 20, pas: 80, noms: true, large: 20 * 4.6 + 80 * 2 });
      $("#ou").textContent = "clé de " + cle + " · " + (A.cur + 1) + " / " + A.n + (A.fautes ? " · " + A.fautes + " faute" + (A.fautes > 1 ? "s" : "") : "");
    } else if (S.phase === "accueil") {
      const v = NIVEAUX[D.niveau], cle = v.cle === "deux" ? "sol" : v.cle;
      const rec = D.records[D.mode === "une" ? "une:" + (D.niveau + 1) : (D.niveau + 1) + ":" + D.cache + ":" + D.n];
      P.innerHTML = portee(cle, cartesDe(D.niveau).filter((k) => k.startsWith(cle + ":")).slice(0, 6).map((k) => ({ k, couleur: "#8d8676" })), { s: 13, pas: 40, hampes: false });
      $("#ou").textContent = D.mode === "avance" ? (D.cache ? D.cache + " note" + (D.cache > 1 ? "s" : "") + " cachée" + (D.cache > 1 ? "s" : "") : "Lis de gauche à droite, sans faute") : "20 notes, une par une";
      $("#chrono").textContent = rec ? "record " + secondes(rec.ms) : "";
    }
    rapport();
  }

  function retour(t, c) { const r = $("#retour"); r.textContent = t; r.className = c || ""; }
  let tTouche = 0;
  function touche(nom, c) {
    clearTimeout(tTouche);
    document.querySelectorAll("#touches button").forEach((b) => { b.classList.toggle("juste", c === "juste" && b.dataset.nom === nom); b.classList.toggle("faux", c === "faux" && b.dataset.nom === nom); });
    tTouche = setTimeout(() => document.querySelectorAll("#touches button").forEach((b) => b.classList.remove("juste", "faux")), 380);
  }

  // ---------- l'écoute : le micro du téléphone, hauteur trouvée ici ----------
  // Autocorrélation normalisée (méthode de McLeod) sur ~85 ms de son ramené à ~24 kHz : du mi grave (82 Hz) au si aigu (988 Hz).
  function hauteur(buf, sr) {
    let x = buf, r = sr;
    if (sr > 30000) { const m = buf.length >> 1; x = new Float32Array(m); for (let i = 0; i < m; i++) x[i] = (buf[2 * i] + buf[2 * i + 1]) * 0.5; r = sr / 2; }
    const n = x.length;
    let moy = 0; for (let i = 0; i < n; i++) moy += x[i]; moy /= n;
    let e = 0; for (let i = 0; i < n; i++) { x[i] -= moy; e += x[i] * x[i]; }
    const rms = Math.sqrt(e / n);
    const maxLag = Math.min(Math.floor(r / 62), n >> 1), minLag = Math.max(2, Math.floor(r / 1500)), W = n - maxLag;
    if (rms < 1e-4 || W < 64) return { f: 0, clarte: 0, rms };
    const nsdf = new Float32Array(maxLag + 2);
    for (let t = 0; t <= maxLag + 1 && t < n - W + 1; t++) {
      let ac = 0, m = 0;
      for (let i = 0; i < W; i++) { const a = x[i], b = x[i + t]; ac += a * b; m += a * a + b * b; }
      nsdf[t] = m > 0 ? 2 * ac / m : 0;
    }
    const pics = [];
    let t = 1;
    while (t <= maxLag && nsdf[t] > 0) t++;          // sortir du premier lobe (décalage nul)
    while (t <= maxLag) {
      while (t <= maxLag && nsdf[t] <= 0) t++;
      let best = -1, bv = 0;
      while (t <= maxLag && nsdf[t] > 0) { if (nsdf[t] > bv) { bv = nsdf[t]; best = t; } t++; }
      if (best > 0 && best >= minLag) pics.push([best, bv]);
    }
    if (!pics.length) return { f: 0, clarte: 0, rms };
    const max = pics.reduce((m, p) => Math.max(m, p[1]), 0);
    const p = pics.find((q) => q[1] >= 0.88 * max);
    const k = p[0], a = nsdf[k - 1], b = nsdf[k], c = nsdf[k + 1], den = a - 2 * b + c;
    const dk = den ? 0.5 * (a - c) / den : 0;
    return { f: r / (k + borne(dk, -0.5, 0.5)), clarte: b, rms };
  }
  const classeDe = (f) => { const m = Math.round(69 + 12 * Math.log2(f / 440)); return { midi: m, j: DEMI.indexOf(((m % 12) + 12) % 12) }; };

  const M = { ctx: null, an: null, flux: null, buf: null, t: 0, plancher: 0.003, dernier: null, compte: 0, verrou: null, envMin: 1, entendus: [], etat: "eteint", erreur: "" };
  async function allumerMicro() {
    if (M.etat === "on") return;
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      M.etat = "ko"; M.erreur = "Le micro demande une adresse https, ouverte dans Chrome.";
      return micro();
    }
    try {
      M.flux = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      M.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (M.ctx.state === "suspended") await M.ctx.resume().catch(() => null);
      const src = M.ctx.createMediaStreamSource(M.flux);
      M.an = M.ctx.createAnalyser();
      M.an.fftSize = 4096;
      src.connect(M.an);                              // rien vers les haut-parleurs : aucun son
      M.buf = new Float32Array(M.an.fftSize);
      M.etat = "on"; M.erreur = "";
      clearInterval(M.t);
      M.t = setInterval(ecouter, 35);
      try { if (navigator.wakeLock) M.reveil = await navigator.wakeLock.request("screen"); } catch (e) { /* pas grave */ }
    } catch (e) {
      M.etat = "ko";
      M.erreur = e && e.name === "NotAllowedError" ? "Micro refusé : autorise-le (cadenas à gauche de l'adresse), dans Chrome." : "Micro indisponible (" + (e && e.name || "erreur") + ").";
    }
    micro();
  }
  function eteindreMicro() {
    clearInterval(M.t);
    try { M.flux && M.flux.getTracks().forEach((t) => t.stop()); } catch (e) {}
    try { M.ctx && M.ctx.close(); } catch (e) {}
    try { M.reveil && M.reveil.release(); } catch (e) {}
    Object.assign(M, { ctx: null, an: null, flux: null, etat: "eteint", verrou: null, dernier: null, compte: 0 });
    $("#entendu").textContent = "–"; $("#niveau-son i").style.width = "0";
    micro();
  }
  function micro() {
    const b = $("#micro");
    b.className = M.etat === "on" ? "on" : M.etat === "ko" ? "ko" : "";
    b.querySelector("span").textContent = M.etat === "on" ? "Micro allumé" : "Allumer le micro";
    $("#aide").textContent = M.erreur || (M.etat === "on" ? "Joue la note au piano : seul son nom compte, pas l'octave." : "Allume le micro pour jouer au piano, ou touche le nom de la note.");
    rapport();
  }
  function ecouter() {
    if (!M.an) return;
    M.an.getFloatTimeDomainData(M.buf);
    const h = hauteur(M.buf, M.ctx.sampleRate), env = h.rms;
    M.plancher = env < M.plancher ? M.plancher * 0.8 + env * 0.2 : Math.min(0.05, M.plancher * 1.002 + 1e-6);
    const seuil = Math.max(0.006, M.plancher * 3);
    $("#niveau-son i").style.width = Math.round(borne(Math.sqrt(env / 0.25), 0, 1) * 100) + "%";
    let j = -1;
    if (env > seuil && h.f >= 70 && h.f <= 1400 && h.clarte > 0.8) j = classeDe(h.f).j;
    if (j >= 0 && j === M.dernier) M.compte++; else { M.dernier = j >= 0 ? j : null; M.compte = j >= 0 ? 1 : 0; }
    // une nouvelle attaque (le son remonte franchement) ou le silence : la même note peut de nouveau compter
    if (env < seuil || (env > M.envMin * 2.2 && env > seuil * 1.5)) { M.verrou = null; M.envMin = env; }
    M.envMin = Math.min(M.envMin, env);
    if (j >= 0) {
      const nom = NOMS[j];
      if ($("#entendu").textContent !== nom) $("#entendu").textContent = nom;
      if (M.compte >= 3 && j !== M.verrou) {
        M.verrou = j; M.envMin = env;
        M.entendus.push({ nom, f: Math.round(h.f * 10) / 10, t: Math.round(performance.now()) });
        if (M.entendus.length > 40) M.entendus.shift();
        document.querySelectorAll("#touches button").forEach((b) => b.classList.toggle("ecoute", b.dataset.nom === nom));
        repondre(nom, "micro");
      }
    }
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && M.ctx && M.ctx.state === "suspended") M.ctx.resume().catch(() => null); });

  // ---------- les commandes ----------
  $("#niveau").innerHTML = NIVEAUX.map((v, i) => '<option value="' + i + '">' + (i + 1) + ". " + v.nom + "</option>").join("");
  $("#touches").innerHTML = NOMS.map((n) => '<button type="button" data-nom="' + n + '">' + n + "</button>").join("");
  $("#touches").addEventListener("pointerdown", (e) => { const b = e.target.closest("button"); if (b) { e.preventDefault(); if (S.phase !== "jeu") commencer(); repondre(b.dataset.nom, "bouton"); } });
  $("#modes").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b || b.dataset.mode === D.mode) return; D.mode = b.dataset.mode; sauver(); accueil(); });
  $("#niveau").addEventListener("change", (e) => { D.niveau = borne(+e.target.value, 0, NIVEAUX.length - 1); D.niveau_t = Date.now(); sauver(); accueil(); synchro(); });
  $("#reglages").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const r = b.dataset.r;
    if (r === "cache-") D.cache = borne(D.cache - 1, 0, 5); else if (r === "cache+") D.cache = borne(D.cache + 1, 0, 5);
    else if (r === "n-") D.n = borne(D.n - 1, 3, 30); else if (r === "n+") D.n = borne(D.n + 1, 3, 30);
    sauver(); accueil();
  });
  $("#go").addEventListener("click", () => { commencer(); if (M.etat !== "on" && M.etat !== "ko") allumerMicro(); });
  $("#micro").addEventListener("click", () => { if (M.etat === "on") eteindreMicro(); else allumerMicro(); });
  document.addEventListener("keydown", (e) => {
    const T = { d: "do", r: "ré", m: "mi", f: "fa", s: "sol", l: "la", i: "si" }, k = e.key.toLowerCase();
    if (T[k]) { if (S.phase !== "jeu") commencer(); repondre(T[k], "clavier"); }
    else if (k === " ") { e.preventDefault(); commencer(); }
  });
  function accueil() { clearInterval(S.chrono); S.phase = "accueil"; S.A = null; $("#chrono").textContent = ""; retour("", ""); peindre(); }

  // ---------- pour les essais automatiques (?test) ----------
  function rapport() {
    if (!TEST) return;
    const A = S.A;
    $("#test-sortie").textContent = JSON.stringify({ phase: S.phase, mode: D.mode, niveau: D.niveau + 1, micro: M.etat, erreur: M.erreur, entendus: M.entendus,
      ligne: A ? { cle: A.cle, cur: A.cur, n: A.n, fautes: A.fautes, notes: A.notes.map((x) => x.nom), resultat: A.resultat } : null,
      synchro: SY, records: Object.keys(D.records).length, essais: D.essais.length });
  }
  window.LECTURE = { hauteur, classeDe, repondre, commencer, etat: () => ({ S, D, M }), NIVEAUX, note, synchro, etatSynchro: () => SY };
  if (TEST) setInterval(rapport, 200);

  accueil();
  micro();
  // synchro : au démarrage, au retour du réseau ou de la page, et toutes les minutes (jamais en pleine ligne)
  setTimeout(synchro, 400);
  window.addEventListener("online", () => synchro());
  document.addEventListener("visibilitychange", () => { if (!document.hidden) synchro(); });
  setInterval(() => { if (!document.hidden && S.phase !== "jeu") synchro(); }, 60000);
  if (document.fonts && document.fonts.load) {      // la clé dessinée avec la police musicale dès qu'elle est là
    Promise.race([document.fonts.load("100px \"Noto Music\"", "\u{1D11E}\u{1D122}"), new Promise((ok) => setTimeout(ok, 2500))])
      .then(() => { mesures = {}; peindre(); }).catch(() => null);
  }
  if (params.get("test") === "auto") { commencer(); allumerMicro(); }
})();
</script>
</body>
</html>
